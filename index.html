<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Égua, Chegou!</title>
<meta name="description" content="Comida boa na tua porta, rapidinho.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Égua, Chegou!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#C8102E;color:#FFF4E6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:min(520px,94vw);height:auto}
  a.btn{display:inline-block;background:#FFC94A;color:#5A0A16;font-weight:800;text-decoration:none;padding:14px 26px;border-radius:14px;font-size:17px}
  p{margin:0;opacity:.9;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="logo-completa.jpg" alt="Égua, Chegou! Delivery">
  <a class="btn" id="go" href="https://claude.ai/artifact/4vHv8iiPtCqWnGUAnb7Fu7">Abrir o app</a>
  <p id="msg">Abrindo…</p>
</main>
<script>
  // Aberto pelo ícone da tela inicial: vai direto para o app no Claude.
  // Aberto no navegador: fica nesta página, para dar tempo de instalar com a logo.
  var URL_APP = document.getElementById("go").href;
  var instalado = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var msg = document.getElementById("msg");
  if (instalado) {
    msg.textContent = "Abrindo…";
    setTimeout(function(){ location.href = URL_APP; }, 1200);
  } else {
    msg.innerHTML = "Para instalar com a logo: no Chrome, toque nos três pontinhos e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b> <u>nesta página</u>.";
  }
</script>
</body>
</html>
